# Multi-service Render Blueprint for Hospital Management System Backend & Database
services:
  # Spring Boot Backend API Web Service
  - type: web
    name: hospital-management-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/departments
    envVars:
      - key: PORT
        value: 8085
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: hospital-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: hospital-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com"

# Managed MySQL Database
databases:
  - name: hospital-db
    databaseName: hospital_management
    user: hospital_user
    plan: free
    region: oregon
